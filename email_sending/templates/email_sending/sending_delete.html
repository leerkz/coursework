{% extends 'email_sending/base.html' %}
{% block title %}Удаление рассылки{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2 class="text-center">Удаление рассылки</h2>
    <p class="text-center">Вы уверены, что хотите удалить рассылку <strong>{{ object.message.topic }}</strong>?</p>
    <div class="text-center">
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Удалить</button>
            <a href="{% url 'email_sending:home' %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
